name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies via vcpkg
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install glfw3:x64-windows opus:x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: |
          cmake --build build --config Release --target NanoVoice

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoVoice-win-x64
          path: build/Release/NanoVoice.exe